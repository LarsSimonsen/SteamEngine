<p><img class="size-medium wp-image-417 alignright" src="blog/assets/uploads/2016/12/Square-vs-Rectangle-300x300.jpg" alt="Square-vs-Rectangle" width="300" height="300" srcset="blog/assets/uploads/2016/12/Square-vs-Rectangle-300x300.jpg 300w, blog/assets/uploads/2016/12/Square-vs-Rectangle.jpg 400w" sizes="(max-width: 300px) 100vw, 300px" />A square wire is a ribbon wire that has a width equal to its thickness.</p>
<p>In other words, you can already use <a href="." target="_blank" rel="noopener noreferrer">Steam Engine</a> with square wires. Just set the width equal to the thickness, and you&#8217;re done.</p>
